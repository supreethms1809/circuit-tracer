# Linear CLT baseline for Qwen2.5-0.5B (Qwen/Qwen2.5-0.5B)
# Feature-matched: same d_transcoder=4096 as Spline-CLT

# Model architecture
n_layers: 24
d_model: 896
d_transcoder: 4096
grid_size: 5
spline_order: 3

# Training
learning_rate: 5.0e-5
warmup_steps: 10000
total_steps: 600000
batch_size: 32
lambda_sparsity: 0.02
c_sparsity: 2.0
grad_clip: 1.0

# Logging & checkpointing
log_every: 200
eval_every: 10000
save_every: 50000
checkpoint_dir: checkpoints/qwen25_05b_linear
run_name: linear_clt_qwen25_05b

# Grid update (unused for linear)
update_grid_every: 0
update_grid_from: 0

# Data
data_dir: data/activations_qwen25_05b
device: cuda
dtype: bfloat16
val_fraction: 0.05
