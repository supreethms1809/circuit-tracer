# Spline-CLT training config for Gemma 3 1B (google/gemma-3-1b-pt)
# 26 layers, 1152-dim residual stream, d_transcoder=4096 (3.6x expansion)
#
# Note: Gemma 3 1B is the smallest Gemma 3 text model.  It has 26 layers
# (not 12), so the cross-layer decoder has 351 weight matrices vs GPT-2's 78.
# d_transcoder is set to 4096 to keep training memory under ~30GB (params+optim)
# on GH200 96GB, leaving room for activation memory.
#
# Parameter budget:
#   KAN encoder: 10 × 4096 × 1152 × 26 layers  =  1,227.1M
#   Decoder:     4096 × 1152 × 351 cross-layer   =  1,656.0M
#   Total:       ~2,883M params
#   Training memory: ~29GB (params+optimizer) + ~25GB activations ≈ 54GB

# Model architecture
n_layers: 26
d_model: 1152
d_transcoder: 4096
grid_size: 5
spline_order: 3

# Training
learning_rate: 5.0e-5
warmup_steps: 10000
total_steps: 600000
batch_size: 16
lambda_sparsity: 0.005
c_sparsity: 1.0
grad_clip: 1.0

# Logging & checkpointing
log_every: 200
eval_every: 10000
save_every: 50000
checkpoint_dir: checkpoints/gemma3_1b
run_name: spline_clt_gemma3_1b

# Grid update
update_grid_every: 150000
update_grid_from: 10000

# Data
data_dir: data/activations_gemma3_1b
device: cuda
dtype: bfloat16
val_fraction: 0.05
