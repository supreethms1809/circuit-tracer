# Linear CLT baseline config for GPT-2 small — matched feature count to KAN-CLT
# Same architecture as gpt2_small.yaml but with linear encoder (W_enc @ x)
# for direct comparison against KAN-CLT.
#
# Parameter counts — matched to KAN-CLT total:
#   KAN-CLT (d_transcoder=4096):  622.96M total params
#     encoder: base_weight(4096×768) + spline_weight(4096×768×8) + spline_scaler(4096×768) = 31.5M/layer × 12 = 377.5M
#     decoder: 4096 × 768 × 78 = 245.4M  (78 = Σk=1..12 k)
#   Linear CLT (d_transcoder=9216): 637.3M total params  (+2.3% vs KAN; rounds to nearest clean multiple)
#     encoder: 9216 × 768 = 7.1M/layer × 12 = 84.9M
#     decoder: 9216 × 768 × 78 = 551.4M
#   Exact match would require d_transcoder=9009; 9216=9×1024 is used for cleanliness.
#   A 2.3% parameter surplus for linear only strengthens the KAN claim if KAN still wins.
#
# v2 calibration (2026-03-04):
#   Training hyperparameters kept identical to gpt2_small.yaml (KAN) for a fair
#   comparison.  The v1 linear run collapsed into a BOS-token attractor:
#     - All top-50 features had activation_frequency=1.0 (always-on)
#     - Circuit tracing showed only position-0 (<|endoftext|>) features in top-15
#   Root cause: λ=0.05 made the sparsity loss dominate early, so the model learned
#   to satisfy reconstruction with constant BOS features rather than sparse
#   semantic ones.  Same fix as KAN: λ=0.002.

# Model architecture
n_layers: 12
d_model: 768
d_transcoder: 9216
encoder_type: linear
grid_size: 5         # unused for linear encoder
spline_order: 3      # unused for linear encoder

# Training (identical to KAN-CLT for fair comparison)
learning_rate: 1.0e-4
warmup_steps: 5000
total_steps: 400000
batch_size: 32
lambda_sparsity: 0.002
c_sparsity: 1.0
grad_clip: 1.0

# Logging & checkpointing
log_every: 200
eval_every: 10000
save_every: 10000
checkpoint_dir: checkpoints/gpt2_small_linear
run_name: linear_clt_gpt2

# Optimizer restarts — matches KAN's 3 Adam resets at steps 100K/200K/300K.
# KAN resets Adam after each grid update; giving linear the same schedule ensures
# neither model gets an unfair optimization advantage from fresh momentum.
reset_optimizer_every: 100000

# Grid update (disabled for linear encoder)
update_grid_every: 0
update_grid_from: 0

# Data
data_dir: data/activations
device: cuda
dtype: bfloat16
val_fraction: 0.05
