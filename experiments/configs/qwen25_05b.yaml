# Spline-CLT training config for Qwen2.5-0.5B (Qwen/Qwen2.5-0.5B)
# 24 layers, 896-dim residual stream, d_transcoder=4096 (4.6x expansion)
#
# Purpose: study how MSE reconstruction scales with more layers (24 vs
# GPT-2's 12) at a comparable d_model (896 vs 768).  The cross-layer
# decoder has 300 weight matrices vs GPT-2's 78.
#
# Parameter budget:
#   KAN encoder: 10 × 4096 × 896 × 24 layers  =    881.0M
#   Decoder:     4096 × 896 × 300 cross-layer   =  1,101.0M
#   Total:       ~1,982M params
#   Training memory: ~20GB (params+optimizer) + ~20GB activations ≈ 40GB

# Model architecture
n_layers: 24
d_model: 896
d_transcoder: 4096
grid_size: 5
spline_order: 3

# Training
learning_rate: 5.0e-5
warmup_steps: 10000
total_steps: 600000
batch_size: 16
lambda_sparsity: 0.005
c_sparsity: 1.0
grad_clip: 1.0

# Logging & checkpointing
log_every: 200
eval_every: 10000
save_every: 50000
checkpoint_dir: checkpoints/qwen25_05b
run_name: spline_clt_qwen25_05b

# Grid update
update_grid_every: 150000
update_grid_from: 10000

# Data
data_dir: data/activations_qwen25_05b
device: cuda
dtype: bfloat16
val_fraction: 0.05
