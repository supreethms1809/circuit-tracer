l0_adapt_every: 200
l0_adapt_rate: 0.08
lambda_nl_gap: 0.0
lambda_frac_hinge: 0.0
learning_rate: 3.0e-4
lr_spline_mult: 1.0
n_steps: 50000
batch_tokens: 2048
seq_len: 1024
dataset: monology/pile-uncopyrighted
seed: 101
log_every: 50
eval_every: 500
eval_batches: 8
dtype: bfloat16
output_dir: /gscratch/ssuresh/results/spline_sae/probe_gemma_kan_l0match
notes: Retune sparsity so KAN L0≈51 like linear; isolate idle-spline from undersparsity.
