# Gemma-2-2B L12 attention-out — KAN + BaseJump
model_name: gemma-2-2b
d_model: 2304
hook_name: blocks.12.hook_attn_out
layer: 12
d_sae: 16384
encoder_type: kan
activation: base_jump
threshold_init: 0.01
jumprelu_bandwidth: 0.01
grid_size: 5
spline_order: 3
scale_base: 1.0
scale_spline: 1.0
lambda_sparsity: 0.0004
target_l0: 51.0
l0_adapt_every: 200
l0_adapt_rate: 0.08
lambda_frac_hinge: 0.0
learning_rate: 3.0e-4
lr_spline_mult: 1.0
n_steps: 50000
batch_tokens: 2048
seq_len: 1024
dataset: monology/pile-uncopyrighted
seed: 101
log_every: 50
eval_every: 500
eval_batches: 8
dtype: bfloat16
output_dir: /gscratch/ssuresh/results/spline_sae/probe_gemma_attn_kan_basejump
notes: Same BaseJump recipe as resid_post, but SAE on hook_attn_out (attn write).
