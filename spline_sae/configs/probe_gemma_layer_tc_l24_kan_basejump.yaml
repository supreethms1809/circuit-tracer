# Gemma-2-2B L24 full-block transcoder — KAN + BaseJump
# encode resid_pre (start of layer) → reconstruct Δ = resid_post - resid_pre
# (resid_post ≈ input to layer 25 / "layer l+1")
model_name: gemma-2-2b
d_model: 2304
hook_name: blocks.24.hook_resid_pre
target_hook_name: blocks.24.hook_resid_post
reconstruct_delta: true
layer: 24
d_sae: 16384
encoder_type: kan
activation: base_jump
threshold_init: 0.01
jumprelu_bandwidth: 0.01
grid_size: 5
spline_order: 3
scale_base: 1.0
scale_spline: 1.0
lambda_sparsity: 0.0004
target_l0: 51.0
l0_adapt_every: 200
l0_adapt_rate: 0.08
lambda_frac_hinge: 0.0
learning_rate: 3.0e-4
lr_spline_mult: 1.0
n_steps: 50000
batch_tokens: 2048
seq_len: 1024
dataset: monology/pile-uncopyrighted
seed: 101
log_every: 50
eval_every: 500
eval_batches: 8
dtype: bfloat16
output_dir: /gscratch/ssuresh/results/spline_sae/probe_gemma_layer_tc_l24_kan_basejump
notes: Full layer write transcoder resid_pre→Δ(resid_post); BaseJump; matched L0.
