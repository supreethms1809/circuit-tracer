# Probe 2b: Llama TopK — warm up both paths, then freeze base so recon must use splines
model_name: meta-llama/Llama-3.1-8B
d_model: 4096
hook_name: blocks.16.hook_resid_post
layer: 16
d_sae: 16384
encoder_type: kan
activation: topk
topk_k: 50
grid_size: 5
spline_order: 3
scale_base: 1.0
scale_spline: 1.0
lambda_sparsity: 0.0
lambda_nl_gap: 0.5
lambda_frac_hinge: 0.1
frac_target: 0.35
freeze_base_after: 10000
learning_rate: 3.0e-4
lr_spline_mult: 3.0
n_steps: 50000
batch_tokens: 1024
seq_len: 1024
dataset: monology/pile-uncopyrighted
seed: 101
log_every: 50
eval_every: 500
eval_batches: 8
dtype: bfloat16
output_dir: /gscratch/ssuresh/results/spline_sae/probe_llama_kan_freeze_base
notes: After 10k steps freeze SiLU/base weights; hinge frac≥0.35; log recon_gap.
